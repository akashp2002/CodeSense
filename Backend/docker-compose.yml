version: '3.8'

services:
  neo4j:
    image: neo4j:5
    container_name: codesense_neo4j
    ports:
      - "7474:7474" # HTTP port (Browser)
      - "7687:7687" # Bolt port (Driver connection)
    environment:
      - NEO4J_AUTH=neo4j/codesense_password
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
